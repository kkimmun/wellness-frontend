name: Deploy React App

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React App
        run: npm run build

      - name: Deploy Frontend to EC2
        run: |
          rm -rf /home/ubuntu/app/dist/*
          cp -r dist/. /home/ubuntu/app/dist/

      - name: Restart Nginx
        run: |
          cd /home/ubuntu/app
          docker compose restart web

      - name: Send Slack Notification
        if: always()
        uses: act10ns/slack@v2
        with:
          status: ${{ job.status }}
          channel: "#wellness-cicd"
          message: |
            🚀 Frontend CI/CD

            저장소: ${{ github.repository }}
            브랜치: ${{ github.ref_name }}
            커밋ID: ${{ github.sha }}
            작성자: ${{ github.actor }}
            상태: ${{ job.status }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
