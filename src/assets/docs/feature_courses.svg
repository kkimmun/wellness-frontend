<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <style>
      .header-title { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-weight: 800; font-size: 19px; fill: #000000; }
      .box { fill: #ffffff; stroke: #000000; stroke-width: 2; rx: 10px; }
      .step-num { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-weight: 800; font-size: 11px; fill: #666666; text-anchor: middle; }
      .title { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-weight: 800; font-size: 15px; fill: #000000; text-anchor: middle; }
      .sub { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-weight: 500; font-size: 12px; fill: #444444; text-anchor: middle; }
      .arrow { stroke: #000000; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-head { fill: #000000; }
    </style>
  </defs>

  <rect width="920" height="220" fill="#ffffff"/>

  <!-- Main Feature Header -->
  <text x="15" y="32" class="header-title">🧭 맞춤형 코스 제작 &amp; AI 추천 처리 흐름 (Course Creation Flow)</text>

  <!-- Step 1 -->
  <g transform="translate(15, 60)">
    <rect width="180" height="135" class="box"/>
    <text x="90" y="30" class="step-num">STEP 01</text>
    <text x="90" y="55" class="title">모드 선택 &amp; 가드</text>
    <text x="90" y="85" class="sub">• J모드 / P모드 전환</text>
    <text x="90" y="108" class="sub">• 비로그인 시 로그인 유도</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(205, 128)">
    <line x1="0" y1="0" x2="20" y2="0" class="arrow"/>
    <polygon points="20,-4 28,0 20,4" class="arrow-head"/>
  </g>

  <!-- Step 2 -->
  <g transform="translate(243, 60)">
    <rect width="190" height="135" class="box"/>
    <text x="95" y="30" class="step-num">STEP 02</text>
    <text x="95" y="55" class="title">위치 &amp; 조건 수집</text>
    <text x="95" y="85" class="sub">• 브라우저 Geolocation</text>
    <text x="95" y="108" class="sub">• 선호 태그 &amp; 장소 선택</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(443, 128)">
    <line x1="0" y1="0" x2="20" y2="0" class="arrow"/>
    <polygon points="20,-4 28,0 20,4" class="arrow-head"/>
  </g>

  <!-- Step 3 -->
  <g transform="translate(473, 60)">
    <rect width="190" height="135" class="box"/>
    <text x="95" y="30" class="step-num">STEP 03</text>
    <text x="95" y="55" class="title">추천 연산 &amp; 매핑</text>
    <text x="95" y="85" class="sub">• AI 맞춤 코스 API 요청</text>
    <text x="95" y="108" class="sub">• 코스 주변 맛집 매핑</text>
  </g>

  <!-- Arrow 3 -->
  <g transform="translate(673, 128)">
    <line x1="0" y1="0" x2="20" y2="0" class="arrow"/>
    <polygon points="20,-4 28,0 20,4" class="arrow-head"/>
  </g>

  <!-- Step 4 -->
  <g transform="translate(703, 60)">
    <rect width="190" height="135" class="box"/>
    <text x="95" y="30" class="step-num">STEP 04</text>
    <text x="95" y="55" class="title">순차 마커 &amp; 경로선</text>
    <text x="95" y="85" class="sub">• 방문 순서(1,2,3..) 마커</text>
    <text x="95" y="108" class="sub">• CourseRouteLine 화살표</text>
  </g>
</svg>
